name: Agent Benchmark Radar Cron

on:
  schedule:
    # Runs daily at 08:00 UTC
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-wire:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git clone --depth 1 "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" .

      - name: Install dependencies
        run: |
          python3 -m pip install --break-system-packages --upgrade pip
          python3 -m pip install --break-system-packages -r requirements.txt

      - name: Execute Benchmark Ingestion
        run: |
          python3 ingest_benchmarks.py

      - name: Commit and push updates
        run: |
          git config user.name "sota-radar-bot[bot]"
          git config user.email "sota-radar-bot@users.noreply.github.com"
          git add -A data/
          
          if git diff --staged --quiet; then
            echo "No leaderboard shifts today. Skipping commit."
          else
            git commit -m "chore(benchmarks): publish daily SOTA leaderboard updates [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
